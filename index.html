<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 7: CSS & JS Interactivity</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Week 7: Bringing Web Pages to Life</h1>
    </header>

    <main>
        <!-- Part 1: CSS Animations -->
        <section id="css-animations">
            <h2>CSS Animations</h2>
            <button class="animated-btn">Hover Me!</button>
            <div class="animated-box"></div>
        </section>

        <!-- Part 2: JavaScript Functions -->
        <section id="js-functions">
            <h2>JavaScript Functions</h2>
            <button id="trigger-js">Click Me</button>
            <p id="js-output"></p>
        </section>

        <!-- Part 3: CSS + JS Integration -->
        <section id="combined">
            <h2>Combined CSS & JS Effects</h2>
            <button id="animate-box-btn">Animate Box</button>
            <div id="box-to-animate"></div>
        </section>
    </main>

    <footer>
        <p>Week 7 Assignment</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
